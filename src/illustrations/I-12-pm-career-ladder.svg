<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="i12-title i12-desc">
<title id="i12-title">The PM career ladder and the fork</title>
<desc id="i12-desc">A ladder read from the bottom up. Entry: Associate PM. Core: Product Manager. Senior: Senior PM, marked as a destination for many. Around the senior-to-staff boundary the ladder forks. The manager track goes Group PM, Director of Product, VP Product, Chief Product Officer. The individual-contributor track goes Principal PM, then Distinguished or Fellow at companies that have it. A double-headed arrow between Group PM and Principal PM shows the fork is reversible.</desc>
<style>
.ill text{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:var(--ill-ink,#0D0630)}
.ill .s{font-size:14px}
.ill .l{font-size:18px}
.ill .b{font-weight:600}
.ill .c{text-anchor:middle}
.ill .e{text-anchor:end}
.ill .m{fill:var(--ill-muted,#4A5466)}
.ill .ta{fill:var(--ill-accent-text,#0D0630)}
.ill .th{fill:var(--ill-highlight-text,#0D0630)}
.ill .box{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .boxk{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .soft{fill:var(--ill-soft,#BBDEF0)}
.ill .acc{fill:var(--ill-accent,#DD614A)}
.ill .tint{fill:var(--ill-accent,#DD614A);fill-opacity:.14}
.ill .hl{fill:var(--ill-highlight,#FFF689)}
.ill .ink{fill:var(--ill-ink,#0D0630)}
.ill .ln{fill:none;stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .lk{fill:none;stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .lm{fill:none;stroke:var(--ill-muted,#4A5466);stroke-width:2}
.ill .la{fill:none;stroke:var(--ill-accent,#DD614A);stroke-width:2.5}
.ill .w2{stroke-width:2}
.ill .w3{stroke-width:3}
.ill .d{stroke-dasharray:5 4}
</style>
<defs>
<marker id="i12-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="acc"/></marker>
</defs>

<!-- Level labels -->
<text x="16" y="45" class="s m">Top</text>
<text x="16" y="105" class="s m">Executive</text>
<text x="16" y="165" class="s m">Leadership</text>
<text x="16" y="225" class="s m">Staff</text>
<text x="16" y="315" class="s m">Senior</text>
<text x="16" y="377" class="s m">Core</text>
<text x="16" y="439" class="s m">Entry</text>

<!-- Connectors -->
<path d="M380,414 V392 M380,352 V330 M380,290 V262" class="ln"/>
<path d="M380,262 H235 V240 M380,262 H525 V240" class="ln"/>
<path d="M235,200 V180 M235,140 V120 M235,80 V60" class="ln"/>
<path d="M525,200 V180" class="ln d"/>

<!-- Trunk -->
<rect x="290" y="414" width="180" height="40" rx="8" class="boxk"/>
<text x="380" y="439" class="b c">Associate PM</text>
<rect x="290" y="352" width="180" height="40" rx="8" class="boxk"/>
<text x="380" y="377" class="b c">Product Manager</text>
<rect x="290" y="290" width="180" height="40" rx="8" class="boxk"/>
<text x="380" y="315" class="b c">Senior PM</text>
<rect x="482" y="297" width="180" height="26" rx="4" class="hl"/>
<text x="572" y="315" class="s c th">A destination for many</text>

<!-- Fork -->
<circle cx="380" cy="262" r="7" class="acc"/>
<text x="200" y="284" class="s b m c">Manager track</text>
<text x="560" y="284" class="s b m c">Individual-contributor track</text>

<!-- Manager track -->
<rect x="140" y="200" width="190" height="40" rx="8" class="boxk"/>
<text x="235" y="225" class="b c">Group PM</text>
<rect x="140" y="140" width="190" height="40" rx="8" class="boxk"/>
<text x="235" y="165" class="b c">Director of Product</text>
<rect x="140" y="80" width="190" height="40" rx="8" class="boxk"/>
<text x="235" y="105" class="b c">VP Product</text>
<rect x="140" y="20" width="190" height="40" rx="8" class="boxk"/>
<text x="235" y="45" class="b c">Chief Product Officer</text>

<!-- IC track -->
<rect x="430" y="200" width="190" height="40" rx="8" class="boxk"/>
<text x="525" y="225" class="b c">Principal PM</text>
<text x="525" y="132" class="s m c">at companies that have it</text>
<rect x="430" y="140" width="190" height="40" rx="8" class="box d"/>
<text x="525" y="165" class="m c">Distinguished / Fellow</text>

<!-- Reversible -->
<path d="M338,220 H422" class="la" marker-start="url(#i12-a)" marker-end="url(#i12-a)"/>
<text x="380" y="210" class="s m c">reversible</text>
</svg>
