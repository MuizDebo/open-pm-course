<text x="16" y="52" class="s m">Features against quarters</text>

<text x="102" y="84" class="s b m c">Q1</text>
<text x="274" y="84" class="s b m c">Q2</text>
<text x="446" y="84" class="s b m c">Q3</text>
<text x="618" y="84" class="s b m c">Q4</text>
