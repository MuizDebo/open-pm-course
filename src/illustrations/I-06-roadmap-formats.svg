<path d="M188,68 V176 M360,68 V176 M532,68 V176" class="ln"/>

<rect x="22" y="104" width="160" height="30" rx="6" class="boxk"/>
<text x="102" y="124" class="s c">Guided setup</text>
<rect x="194" y="142" width="160" height="30" rx="6" class="boxk"/>
<text x="274" y="162" class="s c">SMS reminders</text>
<rect x="366" y="104" width="160" height="30" rx="6" class="boxk d"/>
<text x="446" y="124" class="s c">CSV import</text>
