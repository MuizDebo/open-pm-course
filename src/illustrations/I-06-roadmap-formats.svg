<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="i06-title i06-desc">
<title id="i06-title">A date-based roadmap beside a Now / Next / Later roadmap</title>
<desc id="i06-desc">Top: a date-based roadmap with four features placed in quarters one to four: guided setup, SMS reminders, CSV import and multi-currency. The first two quarters read as promises that get screenshotted; the far columns are fiction. Bottom: the same work as a Now / Next / Later roadmap. Now ("we are sure") holds problems with named solutions: first invoice faster, solution guided setup; paid on time, solution SMS reminders. Next ("fairly sure") holds themes with likely solutions: bulk invoicing, likely CSV import; clients abroad, likely multi-currency. Later ("interested") holds themes only: accountant access and offline invoicing. An arrow underneath points left: items move left as they become clearer.</desc>
<style>
.ill text{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:var(--ill-ink,#0D0630)}
.ill .s{font-size:14px}
.ill .l{font-size:18px}
.ill .b{font-weight:600}
.ill .c{text-anchor:middle}
.ill .e{text-anchor:end}
.ill .m{fill:var(--ill-muted,#4A5466)}
.ill .ta{fill:var(--ill-accent-text,#0D0630)}
.ill .th{fill:var(--ill-highlight-text,#0D0630)}
.ill .box{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .boxk{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .soft{fill:var(--ill-soft,#BBDEF0)}
.ill .acc{fill:var(--ill-accent,#DD614A)}
.ill .tint{fill:var(--ill-accent,#DD614A);fill-opacity:.14}
.ill .hl{fill:var(--ill-highlight,#FFF689)}
.ill .ink{fill:var(--ill-ink,#0D0630)}
.ill .ln{fill:none;stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .lk{fill:none;stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .lm{fill:none;stroke:var(--ill-muted,#4A5466);stroke-width:2}
.ill .la{fill:none;stroke:var(--ill-accent,#DD614A);stroke-width:2.5}
.ill .w2{stroke-width:2}
.ill .w3{stroke-width:3}
.ill .d{stroke-dasharray:5 4}
</style>
<defs>
<marker id="i06-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="acc"/></marker>
</defs>

