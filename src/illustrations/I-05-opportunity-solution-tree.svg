<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="i05-title i05-desc">
<title id="i05-title">An opportunity solution tree, worked example</title>
<desc id="i05-desc">A four-level tree. The outcome at the top: more retailers record a sale on the same day. Beneath it, three opportunities in customers' words: "I note sales in a notebook first", "Too busy serving to log it" (the chosen target opportunity, highlighted) and "The network drops when I try". Beneath the target opportunity, three candidate solutions: a quick-entry screen, a one-tap repeat sale and voice-note entry. Beneath each solution, an assumption test: a one-day prototype with three retailers, a fake door that counts the taps, and a concierge test logging by hand for five customers.</desc>
<style>
.ill text{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:var(--ill-ink,#0D0630)}
.ill .s{font-size:14px}
.ill .l{font-size:18px}
.ill .b{font-weight:600}
.ill .c{text-anchor:middle}
.ill .e{text-anchor:end}
.ill .m{fill:var(--ill-muted,#4A5466)}
.ill .ta{fill:var(--ill-accent-text,#0D0630)}
.ill .th{fill:var(--ill-highlight-text,#0D0630)}
.ill .box{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .boxk{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .soft{fill:var(--ill-soft,#BBDEF0)}
.ill .acc{fill:var(--ill-accent,#DD614A)}
.ill .tint{fill:var(--ill-accent,#DD614A);fill-opacity:.14}
.ill .hl{fill:var(--ill-highlight,#FFF689)}
.ill .ink{fill:var(--ill-ink,#0D0630)}
.ill .ln{fill:none;stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .lk{fill:none;stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .lm{fill:none;stroke:var(--ill-muted,#4A5466);stroke-width:2}
.ill .la{fill:none;stroke:var(--ill-accent,#DD614A);stroke-width:2.5}
.ill .w2{stroke-width:2}
.ill .w3{stroke-width:3}
.ill .d{stroke-dasharray:5 4}
</style>

<!-- Level labels -->
<text x="16" y="55" class="s b m">Outcome</text>
<text x="16" y="148" class="s b m">Opportunities</text>
<text x="16" y="166" class="s m">their words</text>
<text x="16" y="260" class="s b m">Solutions</text>
<text x="16" y="346" class="s b m">Assumption</text>
<text x="16" y="364" class="s b m">tests</text>

<!-- Connectors -->
<path d="M420,80 L220,120 M420,80 V120 M420,80 L620,120" class="ln"/>
<path d="M420,180 L220,230 M420,180 V230 M420,180 L620,230" class="ln"/>
<path d="M220,280 V320 M420,280 V320 M620,280 V320" class="ln"/>

<!-- Outcome -->
<rect x="280" y="20" width="280" height="60" rx="10" class="boxk"/>
<text x="420" y="45" class="b c">More retailers record a</text>
<text x="420" y="66" class="b c">sale on the same day</text>

<!-- Opportunities -->
<rect x="130" y="120" width="180" height="60" rx="10" class="box"/>
<text x="220" y="146" class="s c">“I note sales in a</text>
<text x="220" y="165" class="s c">notebook first”</text>
<rect x="330" y="120" width="180" height="60" rx="10" class="acc"/>
<text x="420" y="146" class="s b c ta">“Too busy serving</text>
<text x="420" y="165" class="s b c ta">to log it”</text>
<rect x="530" y="120" width="180" height="60" rx="10" class="box"/>
<text x="620" y="146" class="s c">“The network drops</text>
<text x="620" y="165" class="s c">when I try”</text>

<!-- Solutions -->
<rect x="130" y="230" width="180" height="50" rx="10" class="boxk"/>
<text x="220" y="260" class="s b c">Quick-entry screen</text>
<rect x="330" y="230" width="180" height="50" rx="10" class="boxk"/>
<text x="420" y="260" class="s b c">One-tap repeat sale</text>
<rect x="530" y="230" width="180" height="50" rx="10" class="boxk"/>
<text x="620" y="260" class="s b c">Voice-note entry</text>

<!-- Assumption tests -->
<rect x="130" y="320" width="180" height="60" rx="10" class="soft"/>
<text x="220" y="346" class="s c">One-day prototype</text>
<text x="220" y="365" class="s c">with 3 retailers</text>
<rect x="330" y="320" width="180" height="60" rx="10" class="soft"/>
<text x="420" y="346" class="s c">Fake door:</text>
<text x="420" y="365" class="s c">count the taps</text>
<rect x="530" y="320" width="180" height="60" rx="10" class="soft"/>
<text x="620" y="346" class="s c">Concierge: log by</text>
<text x="620" y="365" class="s c">hand for 5 customers</text>

<!-- Legend -->
<rect x="16" y="402" width="16" height="16" rx="3" class="acc"/>
<text x="42" y="415" class="s m">Target opportunity: a written-down choice the team can revisit</text>
</svg>
