<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="i02-title i02-desc">
<title id="i02-title">The product lifecycle as a line versus a loop</title>
<desc id="i02-desc">Top: the four stages drawn as a line. Discovery, Definition and Delivery lead to a hard stop at Launch, and Measurement sits after the stop, dashed and marked skipped. Bottom: the same four stages drawn as a loop, Discovery to Definition to Delivery to Measurement, with the arrow from Measurement back to Discovery highlighted, because measurement is the start of the next discovery.</desc>
<style>
.ill text{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:var(--ill-ink,#0D0630)}
.ill .s{font-size:14px}
.ill .l{font-size:18px}
.ill .b{font-weight:600}
.ill .c{text-anchor:middle}
.ill .e{text-anchor:end}
.ill .m{fill:var(--ill-muted,#4A5466)}
.ill .ta{fill:var(--ill-accent-text,#0D0630)}
.ill .th{fill:var(--ill-highlight-text,#0D0630)}
.ill .box{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .boxk{fill:var(--ill-surface,#FFFFFF);stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .soft{fill:var(--ill-soft,#BBDEF0)}
.ill .acc{fill:var(--ill-accent,#DD614A)}
.ill .tint{fill:var(--ill-accent,#DD614A);fill-opacity:.14}
.ill .hl{fill:var(--ill-highlight,#FFF689)}
.ill .ink{fill:var(--ill-ink,#0D0630)}
.ill .ln{fill:none;stroke:var(--ill-line,#B0C2CE);stroke-width:1.5}
.ill .lk{fill:none;stroke:var(--ill-ink,#0D0630);stroke-width:1.5}
.ill .lm{fill:none;stroke:var(--ill-muted,#4A5466);stroke-width:2}
.ill .la{fill:none;stroke:var(--ill-accent,#DD614A);stroke-width:2.5}
.ill .w2{stroke-width:2}
.ill .w3{stroke-width:3}
.ill .d{stroke-dasharray:5 4}
</style>
<defs>
<marker id="i02-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="ink"/></marker>
<marker id="i02-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="acc"/></marker>
</defs>

<!-- A line -->
<text x="16" y="32" class="l b">A line</text>
<text x="16" y="54" class="s m">Ends at launch</text>

<rect x="16" y="74" width="130" height="50" rx="10" class="box"/>
<text x="81" y="104" class="b c">Discovery</text>
<rect x="186" y="74" width="130" height="50" rx="10" class="box"/>
<text x="251" y="104" class="b c">Definition</text>
<rect x="356" y="74" width="130" height="50" rx="10" class="box"/>
<text x="421" y="104" class="b c">Delivery</text>
<path d="M150,99 H180" class="lk" marker-end="url(#i02-k)"/>
<path d="M320,99 H350" class="lk" marker-end="url(#i02-k)"/>
<path d="M490,99 H520" class="lk" marker-end="url(#i02-k)"/>
<path d="M528,66 V132" class="lk w3"/>
<text x="528" y="152" class="s b c">Launch</text>

<rect x="564" y="74" width="140" height="50" rx="10" class="box d"/>
<text x="634" y="104" class="m c">Measurement</text>
<text x="634" y="152" class="s m c">skipped</text>

<path d="M16,180 H704" class="ln"/>

<!-- A loop -->
<text x="16" y="214" class="l b">A loop</text>
<text x="16" y="238" class="s m">Launch is where</text>
<text x="16" y="258" class="s m">you learn the most</text>

<path d="M489,237 A190,105 0 0 1 578.5,294" class="lk" marker-end="url(#i02-k)"/>
<path d="M578.5,366 A190,105 0 0 1 489,423" class="lk" marker-end="url(#i02-k)"/>
<path d="M311,423 A190,105 0 0 1 221.5,366" class="lk" marker-end="url(#i02-k)"/>
<path d="M221.5,294 A190,105 0 0 1 311,237" class="la" marker-end="url(#i02-a)"/>

<rect x="330" y="203" width="140" height="44" rx="10" class="boxk"/>
<text x="400" y="230" class="b c">Discovery</text>
<rect x="520" y="308" width="140" height="44" rx="10" class="boxk"/>
<text x="590" y="335" class="b c">Definition</text>
<rect x="330" y="413" width="140" height="44" rx="10" class="boxk"/>
<text x="400" y="440" class="b c">Delivery</text>
<rect x="140" y="308" width="140" height="44" rx="10" class="boxk"/>
<text x="210" y="335" class="b c">Measurement</text>

<text x="400" y="326" class="s m c">Measurement is the start</text>
<text x="400" y="346" class="s m c">of the next discovery</text>
</svg>
